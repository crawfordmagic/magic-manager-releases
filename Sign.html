
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_top">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B10; --panel:#15151E; --panel2:#1C1C27;
    --gold:#C9A050; --gold-bright:#E4C179; --gold-deep:#6E5730;
    --cream:#F4EBD3; --muted:#928A75; --crimson:#C05236;
    --line:rgba(201,160,80,.28); --tint:rgba(201,160,80,.14); --on-accent:#141008;
  }
  *{box-sizing:border-box}
  html,body{background:var(--ink);color:var(--cream);font-family:'Archivo',sans-serif;font-size:15px;margin:0;line-height:1.5}
  .wrap{max-width:480px;margin:0 auto;padding:28px 20px 60px}
  h1{font-family:'Playfair Display',serif;font-size:26px;margin:0 0 2px;text-align:center;color:var(--cream)}
  .logo{display:block;margin:0 auto 20px;width:190px;height:auto}
  .portal-label{text-align:center;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:-14px 0 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:none}
  .k{color:var(--muted);font-size:13px}
  .v{color:var(--cream);font-weight:600;font-size:13.5px;text-align:right}
  label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:16px 0 6px}
  input[type="text"]{width:100%;font-family:'Archivo',sans-serif;font-size:16px;color:var(--cream);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;outline:none}
  input[type="text"]:focus{border-color:var(--gold)}
  select{width:100%;font-family:'Archivo',sans-serif;font-size:16px;color:var(--cream);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;outline:none;color-scheme:dark}
  select:focus{border-color:var(--gold)}
  .feenote{font-size:11.5px;color:var(--gold-bright);margin-top:6px}
  .paybtn{display:block;text-align:center;text-decoration:none;background:var(--gold);color:var(--on-accent);font-weight:700;font-size:15px;border-radius:8px;padding:12px;margin-top:12px}
  .paynote{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
  .paydetails{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:12px;font-size:13px;line-height:1.7;color:var(--cream)}
  .paydetails-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:4px}
  .paidbanner{background:var(--tint);border:1px solid var(--gold);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:13.5px;color:var(--gold-bright);text-align:center}
  .bookingid{text-align:center;margin:0 0 10px}
  .bookingid .lead{font-size:11.5px;color:var(--muted);margin-bottom:2px}
  .bookingid .name{font-family:'Playfair Display',serif;font-size:19px;color:var(--cream);font-weight:700}
  .agree{display:flex;align-items:flex-start;gap:10px;margin-top:16px;font-size:13px;color:var(--muted)}
  .agree input{margin-top:3px}
  button{width:100%;font-family:'Archivo',sans-serif;font-size:16px;font-weight:700;padding:14px;border-radius:10px;border:none;background:var(--gold);color:var(--on-accent);margin-top:18px;cursor:pointer}
  button:disabled{opacity:.5}
  .note{color:var(--muted);font-size:12px;text-align:center;margin-top:12px}
  .signed{text-align:center;padding:0 10px 26px}
  .signed .big{font-size:40px;margin-bottom:10px}
  .err{color:#E9927B;text-align:center;padding:30px 10px}
  .fbstar{font-size:32px;color:var(--gold);cursor:pointer;line-height:1;-webkit-user-select:none;user-select:none;padding:2px}
  .fbstar.on{color:var(--gold-bright)}
  #loading{text-align:center;color:var(--muted);padding:40px 0}
  .docs{margin-top:16px}
  .docs-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 8px}
  .docbtn{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--panel2);border:1px solid var(--gold);border-radius:10px;padding:13px 14px;margin-bottom:8px;color:var(--gold-bright);font-weight:600;font-size:14.5px}
  .docbtn:active{background:var(--tint)}
  .dic{color:var(--gold);flex:0 0 auto}
  .doclabel{flex:1}
  .docarrow{color:var(--gold);flex:0 0 auto}
</style>
<?!= themeHtml ?>
</head>
<body>
<div class="wrap">
  <? if (cfg.LOGO_URL) { ?><img class="logo" src="<?= cfg.LOGO_URL ?>" alt="<?= cfg.BUSINESS_NAME ?>"><? } ?>
  <div class="portal-label">Your Event Portal</div>
  <div id="loading">Loading your agreement&#8230;</div>
  <div id="content" style="display:none"></div>
</div>

<script>
var TOKEN='<?= token ?>';
var PAID='<?= paid ?>';
var CFG=<?!= JSON.stringify(cfg) ?>;

function renderError(){
  document.getElementById('loading').style.display='none';
  var c=document.getElementById('content');
  c.style.display='';
  c.innerHTML='<div class="err">We couldn\u2019t find this agreement. Please check the link or contact us directly.</div>';
}
function paidBannerHtml(){
  if(PAID!=='1') return '';
  return '<div class="paidbanner">Your card payment was submitted \u2014 We will confirm once it\u2019s received.</div>';
}
function signatureBlockHtml(){
  var webHref = CFG.WEBSITE ? (/^https?:\/\//.test(CFG.WEBSITE)?CFG.WEBSITE:'https://'+CFG.WEBSITE) : '';
  var webDisp = CFG.WEBSITE ? CFG.WEBSITE.replace(/^https?:\/\//,'') : '';
  var bits=[];
  if(CFG.PHONE) bits.push(CFG.PHONE);
  if(CFG.WEBSITE) bits.push('<a href="'+webHref+'" target="_blank" style="color:var(--gold-bright)">'+webDisp+'</a>');
  return '<div style="margin-top:26px;padding-top:16px;border-top:1px solid var(--line)">'
    +'<div>'
      +'<div style="font-weight:700;color:var(--cream);font-size:14px">'+CFG.OWNER_NAME+'</div>'
      +'<div style="font-weight:700;color:var(--gold-bright);font-size:12.5px;margin-bottom:4px">'+CFG.BUSINESS_NAME+'</div>'
      +(bits.length?'<div style="font-size:12px;color:var(--muted)">'+bits.join(' &nbsp;|&nbsp; ')+'</div>':'')
      +(CFG.EMAIL?'<div style="font-size:12px;color:var(--muted)"><a href="mailto:'+CFG.EMAIL+'" style="color:var(--gold-bright)">'+CFG.EMAIL+'</a></div>':'')
    +'</div>'
    +'</div>';
}
function receiptCardHtml(label, url){
  // Once a receipt PDF exists, the "Your Documents" buttons handle viewing it;
  // here we only acknowledge a payment whose receipt isn't ready yet.
  if(url) return '';
  return '<div class="paydetails"><div class="paydetails-title">'+label+'</div><div>Payment recorded \u2014 your receipt is on its way.</div></div>';
}
// The owner's W-9 / proof of insurance (Settings -> Tax form & insurance), if
// uploaded. Shown on the client's booking page so they can grab them when a
// venue or their accounting team asks. URLs come from the config this page
// already receives; returns '' when nothing is uploaded, so nothing shows.
// One "Your Documents" group — a button per file the client can view, and only
// the ones that actually exist. Agreement + receipts come from the booking (d);
// W-9 + insurance from the owner's config. Text-only gold-outline buttons,
// alphabetized by label. The signed agreement is listed only once actually
// signed; before that, the prominent "review the agreement" link above covers it.
function documentButtonsHtml(d, signed){
  function escAttr(u){ return String(u||'').replace(/"/g,'%22').replace(/</g,'%3C').replace(/>/g,'%3E'); }
  d = d || {};
  // Gold line-art icons per document type — stroke="currentColor" so each
  // inherits the gold .dic color (no emoji, matches the theme on every device).
  var IC={
    receipt:'<path d="M5 21v-16a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v16l-3 -2l-2 2l-2 -2l-2 2l-2 -2l-3 2"/><path d="M9 7h6"/><path d="M9 11h6"/><path d="M9 15h4"/>',
    shield:'<path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3"/>',
    fileCheck:'<path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/><path d="M9 15l2 2l4 -4"/>',
    fileText:'<path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/><path d="M9 9h1"/><path d="M9 13h6"/><path d="M9 17h6"/>'
  };
  var docs=[];
  if(signed && d.pdfUrl) docs.push(['Signed agreement', d.pdfUrl, IC.fileCheck]);
  if(d.depositReceiptUrl) docs.push(['Deposit receipt', d.depositReceiptUrl, IC.receipt]);
  if(d.balanceReceiptUrl) docs.push(['Balance receipt', d.balanceReceiptUrl, IC.receipt]);
  if(CFG.W9_URL) docs.push(['W-9 tax form', CFG.W9_URL, IC.fileText]);
  if(CFG.INSURANCE_URL) docs.push(['Proof of insurance', CFG.INSURANCE_URL, IC.shield]);
  if(!docs.length) return '';
  docs.sort(function(a,b){ return a[0].localeCompare(b[0]); });
  return '<div class="docs"><div class="docs-title">Your Documents</div>'
    + docs.map(function(it){
        return '<a class="docbtn" href="'+escAttr(it[1])+'" target="_blank" rel="noopener">'
          +'<svg class="dic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+it[2]+'</svg>'
          +'<span class="doclabel">'+it[0]+'</span>'
          +'<svg class="docarrow" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7l-10 10"/><path d="M8 7l9 0l0 9"/></svg></a>';
      }).join('')
    + '</div>';
}
// The one page a signed client keeps coming back to — it just shows
// whatever's relevant right now: pay the deposit, see the deposit
// receipt, pay the balance once it's actually due, or see the balance
// receipt. Same link the whole way through, nothing new to send later.
function bookingIdHtml(d){
  var line2 = [d.client, d.eventDate].filter(Boolean).join(' \u2014 ');
  if(!line2) return '';
  var invLine = d.invoiceNumber ? '<div style="font-size:11px;color:var(--muted);margin-top:3px">Invoice '+d.invoiceNumber+'</div>' : '';
  return '<div class="bookingid"><div class="lead">Your booking with '+CFG.OWNER_NAME+'</div><div class="name">'+line2+'</div>'+invLine+'</div>';
}
function renderStatusPage(d){
  document.getElementById('loading').style.display='none';
  var c=document.getElementById('content');
  c.style.display='';

  var html = paidBannerHtml() + bookingIdHtml(d);
  html += '<div class="signed"><div class="big">&#10038;</div><div>This agreement was signed'
    +(d.signedName?' by <b>'+esc(d.signedName)+'</b>':'')+'. Thank you!</div></div>';

  html += '<div class="card">'
    +row('Services', d.services)
    +'</div>';

  // A booked client's per-service message (Settings -> Event messages by service), matched to
  // this booking's service. Shown once signed — but only while the event is still upcoming.
  // Once the event date has passed, this anticipation note is replaced, in the same spot, by
  // the post-event review prompt below.
  var eventPassed = (d.daysUntilEvent !== null && d.daysUntilEvent <= 0);
  var svcMsg='';
  try{ var _sm = CFG.SERVICE_MESSAGES ? JSON.parse(CFG.SERVICE_MESSAGES) : null; if(_sm && d.services) svcMsg = _sm[d.services] || ''; }catch(e){}
  if(svcMsg && !eventPassed){
    var smh = String(svcMsg).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    html += '<div class="paydetails"><div class="paydetails-title">A Note From '+CFG.OWNER_NAME+'</div>'
      +'<p style="margin:6px 0 0">'+smh+'</p></div>';
  }
  // Post-event review prompt takes the note's place (feedbackCardHtml returns '' until
  // the event has passed and the balance is paid).
  html += feedbackCardHtml(d);

  var noDeposit = !(Number(d.depositBase) > 0); // deposit waived (0%) — skip straight to the balance
  var showDepositPrompt = !noDeposit && !d.depositPaid;
  var balanceDue = d.daysUntilEvent!==null && d.daysUntilEvent<=d.balanceDueDays;
  // No longer gated on balanceDue — once the deposit's handled, the client
  // can pay the balance whenever they're ready rather than being blocked
  // until it's officially due. The due date still gets shown as context
  // right above the prompt when it's not yet due, just not used to
  // prevent paying early.
  var showBalancePrompt = !d.balancePaid && (noDeposit || d.depositPaid);

  if(d.depositPaid) html += receiptCardHtml('Deposit', d.depositReceiptUrl);
  if(d.balancePaid){
    html += receiptCardHtml('Final Balance', d.balanceReceiptUrl);
  } else if(!d.depositPaid && !noDeposit){
    html += '<div class="paydetails"><div class="paydetails-title">Balance</div><div>Your remaining balance of '+fmtMoney(d.balanceBase)+' will be due once your deposit is received.</div></div>';
  }

  var kind = showDepositPrompt ? 'deposit' : 'balance';
  if(showDepositPrompt || showBalancePrompt){
    var initialMethod = (d.paymentMethod && PAYMENT_METHODS.indexOf(d.paymentMethod)>-1) ? d.paymentMethod : (PAYMENT_METHODS[0]||'Credit Card');
    var initAmt = computeAmounts(d.depositBase, d.balanceBase, initialMethod);
    var baseShown = kind==='balance' ? initAmt.balance : initAmt.deposit;
    if(kind==='balance' && !balanceDue){
      html += '<p class="note" style="margin:0 0 6px">Feel free to pay early \u2014 officially due '+(d.balanceDueDateFmt||'a date closer to your event')+'.</p>';
    }
    html += '<label>How will you be paying your '+(kind==='balance'?'balance':'deposit')+'?</label>'
      +'<select id="paymentMethod">'+PAYMENT_METHODS.map(function(m){
        return '<option value="'+m+'"'+(m===initialMethod?' selected':'')+'>'+m+'</option>';
      }).join('')+'</select>'
      +'<div id="paymentExtra">'+renderExtrasHtml(initialMethod, baseShown, kind)+'</div>';
  }

  html += documentButtonsHtml(d, true);
  html += signatureBlockHtml();

  c.innerHTML = html;

  if(showDepositPrompt || showBalancePrompt){
    var pmSel=document.getElementById('paymentMethod');
    pmSel.onchange=function(){
      var a=computeAmounts(d.depositBase, d.balanceBase, pmSel.value);
      var amt2 = kind==='balance' ? a.balance : a.deposit;
      document.getElementById('paymentExtra').innerHTML=renderExtrasHtml(pmSel.value, amt2, kind);
      // The deposit's payment method is already locked in at signing time —
      // this only matters for the balance, which can genuinely end up paid
      // a different way, and needs its own real record so the balance
      // receipt (and the owner's own view of this lead) reflect what actually
      // happened instead of assuming it matches the deposit.
      if(kind==='balance'){
        google.script.run.withSuccessHandler(function(){}).withFailureHandler(function(){}).saveBalancePaymentMethod(TOKEN, pmSel.value);
      }
    };
  }
}
/* ---------- Post-event feedback (star rating + optional comment) ----------
 * Only shown once the balance is paid and the event has passed (server gates it
 * via d.showFeedback). A 4-5 star rating then offers the owner's Google review
 * link if they've set one; lower ratings stay private with the owner. */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var FB_RATING=0, FB_GOOGLE_URL='', FB_TEXT='';
// Best-effort clipboard copy. Google doesn't allow pre-filling review text, so
// the smoothest we can do is put the client's own note on their clipboard and
// send them to the review box, where they just paste. Tries the modern API then
// falls back to execCommand (better odds inside the Apps Script sandbox frame).
function fbCopy(text){
  text=String(text||''); if(!text) return false;
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text); return true; } }catch(e){}
  try{
    var ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-1000px';
    document.body.appendChild(ta); ta.select(); try{ ta.setSelectionRange(0,text.length); }catch(e2){}
    var ok=document.execCommand('copy'); document.body.removeChild(ta); return ok;
  }catch(e){ return false; }
}
function fbCopyAgain(){
  fbCopy(FB_TEXT);
  var b=document.getElementById('fbCopyBtn'); if(b) b.textContent='✓ Copied — now paste it on Google';
}
function feedbackCardHtml(d){
  if(!d.showFeedback) return '';
  FB_RATING=0; FB_GOOGLE_URL=d.googleReviewUrl||'';
  return '<div class="card" id="fbCard" style="border-color:var(--gold)">'
    +'<div class="paydetails-title" style="margin-bottom:6px">How was your event?</div>'
    +'<p class="note" style="text-align:left;margin:0 0 12px">'+esc(CFG.OWNER_NAME||'We')+' would love your feedback — tap a rating below.</p>'
    +'<div id="fbStars" style="display:flex;gap:8px;justify-content:center;margin:0 0 14px">'
      +[1,2,3,4,5].map(function(n){ return '<span class="fbstar" data-n="'+n+'" onclick="setFbRating('+n+')">☆</span>'; }).join('')
    +'</div>'
    +'<textarea id="fbText" rows="3" placeholder="Anything you’d like to share? (optional)" style="width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--cream);font-size:15px;padding:10px;outline:none;resize:vertical;font-family:inherit"></textarea>'
    +'<label style="display:flex;align-items:center;gap:9px;margin:4px 0 12px;font-size:13.5px;color:var(--cream);cursor:pointer"><input type="checkbox" id="fbReference" style="width:auto;flex:0 0 auto;margin:0"><span>I’m happy to be a reference for future clients.</span></label>'
    +'<button class="paybtn" id="fbSubmit" style="border:none;width:100%" onclick="submitFeedback()">Submit feedback</button>'
    +'<div id="fbErr" style="color:#E9927B;font-size:13px;text-align:center;margin-top:8px;min-height:16px"></div>'
  +'</div>';
}
function setFbRating(n){
  FB_RATING=n;
  var stars=document.querySelectorAll('#fbStars .fbstar');
  for(var i=0;i<stars.length;i++){ var sn=Number(stars[i].getAttribute('data-n')); stars[i].textContent = sn<=n?'★':'☆'; if(sn<=n) stars[i].classList.add('on'); else stars[i].classList.remove('on'); }
  var e=document.getElementById('fbErr'); if(e) e.textContent='';
}
function submitFeedback(){
  if(!FB_RATING){ document.getElementById('fbErr').textContent='Please tap a star rating first.'; return; }
  var text=document.getElementById('fbText').value.trim();
  FB_TEXT=text;
  var refBox=document.getElementById('fbReference'); var wantsRef=!!(refBox && refBox.checked);
  // Copy the note now, while the button tap is still an active user gesture, so
  // it's on their clipboard by the time the Google prompt shows. The Copy button
  // in that prompt is the fallback if the sandbox blocked this.
  if(text && FB_RATING>=4 && FB_GOOGLE_URL) fbCopy(text);
  var btn=document.getElementById('fbSubmit'); var orig=btn.textContent; btn.disabled=true; btn.textContent='Sending…';
  google.script.run.withSuccessHandler(function(json){
    var r; try{ r=JSON.parse(json); }catch(e){ r=null; }
    if(!r||!r.ok){ btn.disabled=false; btn.textContent=orig; document.getElementById('fbErr').textContent=(r&&r.error)||'Could not send — please try again.'; return; }
    showFeedbackDone();
  }).withFailureHandler(function(){ btn.disabled=false; btn.textContent=orig; document.getElementById('fbErr').textContent='Connection error — try again.'; })
    .submitEventFeedback(TOKEN, FB_RATING, text, wantsRef);
}
function showFeedbackDone(){
  var card=document.getElementById('fbCard'); if(!card) return;
  var who=esc(CFG.OWNER_NAME||'us');
  if(FB_RATING>=4 && FB_GOOGLE_URL){
    var hasText = !!(FB_TEXT && FB_TEXT.trim().length);
    var noteBlock = hasText
      ? '<div style="background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin:0 0 10px">'
          +'<div style="font-size:14px;color:var(--cream);white-space:pre-wrap;word-break:break-word">'+esc(FB_TEXT)+'</div>'
          +'<button type="button" id="fbCopyBtn" onclick="fbCopyAgain()" style="margin-top:10px;width:100%;background:transparent;border:1px solid var(--gold);color:var(--gold-bright);font-weight:600;font-size:13px;border-radius:8px;padding:8px 12px;cursor:pointer">Copy my note</button>'
        +'</div>'
        +'<p class="note" style="text-align:left;margin:0 0 12px">Your note is ready — on Google, tap the stars and paste it in. That’s it.</p>'
      : '';
    card.innerHTML='<div class="paydetails-title" style="margin-bottom:6px">Thank you! ✦</div>'
      +'<p class="note" style="text-align:left;margin:0 0 12px">So glad you enjoyed it! Would you mind sharing that on Google? It genuinely helps '+who+'.</p>'
      +noteBlock
      +'<a class="paybtn" target="_top" rel="noopener" href="'+esc(FB_GOOGLE_URL)+'" style="margin-top:0">'+(hasText?'Open Google review ↗':'Share on Google ↗')+'</a>';
  } else {
    card.innerHTML='<div class="paydetails-title" style="margin-bottom:6px">Thank you! ✦</div>'
      +'<p class="note" style="text-align:left;margin:0">Your feedback goes straight to '+who+' — we appreciate it.</p>';
  }
}
var FEE_RATE=(String((CFG&&CFG.CARD_FEE_ENABLED)||'').toLowerCase()==='no')?0:0.0325;
var PAYMENT_METHODS=(function(){var m=[];if(CFG.HAS_ACH||(CFG.ACH_ACCOUNT&&CFG.ACH_ROUTING))m.push('ACH');if(CFG.CASH_INSTRUCTIONS)m.push('Cash');if(CFG.CASHAPP_CASHTAG)m.push('Cash App');if(CFG.CHECK_PAYEE||CFG.CHECK_ADDRESS||CFG.ADDRESS)m.push('Check');if(CFG.CARD_ENABLED)m.push('Credit Card');if(CFG.PAYPAL_USERNAME)m.push('PayPal');if(CFG.VENMO_USERNAME)m.push('Venmo');if(CFG.HAS_WIRE||(CFG.WIRE_ACCOUNT&&CFG.WIRE_ROUTING))m.push('Wire Transfer');if(CFG.ZELLE_HANDLE)m.push('Zelle');return m;})();
// The owner's Venmo username and Cash App cashtag — update these here if
// either ever changes. The Venmo link format is a long-standing pattern
// many businesses rely on, though it's not something Venmo officially
// documents or guarantees; the Cash App format is their own stable,
// supported link style.
var VENMO_USERNAME=CFG.VENMO_USERNAME||'';
var CASHAPP_CASHTAG=CFG.CASHAPP_CASHTAG||'';
var PAYPAL_USERNAME=CFG.PAYPAL_USERNAME||'';
function fmtMoney(n){
  return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function computeAmounts(depositBase, balanceBase, method){
  var isCard = method==='Credit Card';
  return {
    deposit: isCard ? depositBase*(1+FEE_RATE) : depositBase,
    balance: isCard ? balanceBase*(1+FEE_RATE) : balanceBase
  };
}
function payLinkFor(method, amount){
  // Venmo genuinely supports a pre-filled amount via URL (a long-standing,
  // if unofficial, pattern). Cash App does not \u2014 despite a commonly
  // repeated trick online, there's no reliable, supported way to embed an
  // amount in a Cash App link, so that one gets handled separately below
  // with the amount shown as plain text instead of pretending it's pre-filled.
  if(method==='Venmo'){
    var amt=amount.toFixed(2);
    return 'https://venmo.com/'+VENMO_USERNAME+'?txn=pay&amount='+amt+'&note='+encodeURIComponent(CFG.BUSINESS_NAME+' deposit');
  }
  // PayPal.Me supports a pre-filled amount in the path (paypal.me/<handle>/<amount>).
  if(method==='PayPal'){
    return 'https://paypal.me/'+PAYPAL_USERNAME+'/'+amount.toFixed(2);
  }
  return null;
}
// Static bank details for methods that need them shown, rather than a
// click-to-pay link — there's no such thing as a "pay" link for a wire or
// a mailed check, so these just tell the client exactly where to send it.
// Bank numbers arrive with the token-checked booking data (never in the public page); merge them in
// before anything renders so the ACH / wire instructions below can read them from CFG as always.
function applyBank(d){ if(d&&d.bank){ for(var k in d.bank) CFG[k]=d.bank[k]; } }
function paymentInstructionsFor(method){
  if(method==='ACH'){
    return {title:'Bank Transfer (ACH)', lines:[CFG.ACH_BANK,'Account: '+CFG.ACH_ACCOUNT,'Routing: '+CFG.ACH_ROUTING]};
  }
  if(method==='Check'){
    return {title:'Mail a Check', lines:['Payable to \u201c'+(CFG.CHECK_PAYEE||CFG.BUSINESS_LEGAL_NAME)+'\u201d',(CFG.CHECK_PAYEE||CFG.BUSINESS_LEGAL_NAME),(CFG.CHECK_ADDRESS||CFG.ADDRESS)]};
  }
  if(method==='Wire Transfer'){
    return {title:'Wire Transfer', lines:['Account: '+CFG.WIRE_ACCOUNT,'Routing: '+CFG.WIRE_ROUTING,CFG.WIRE_BANK,CFG.WIRE_BANK_ADDRESS,'Beneficiary: '+CFG.BUSINESS_LEGAL_NAME,CFG.ADDRESS]};
  }
  if(method==='Zelle'){
    return {title:'Zelle', lines:['Send to: '+CFG.ZELLE_HANDLE,'Send with Zelle from your banking app to the address above.']};
  }
  if(method==='Cash'){
    return {title:'Cash', lines:[CFG.CASH_INSTRUCTIONS||'Pay in cash in person.']};
  }
  return null;
}
function renderExtrasHtml(method, amt, kind){
  kind = kind || 'deposit';
  var kindLabel = kind==='balance' ? 'Balance' : 'Deposit';
  if(method==='Credit Card'){
    return (FEE_RATE>0?'<p class="feenote">A 3.25% card processing fee is included in the amounts above.</p>':'')
      +'<button type="button" class="paybtn" id="cardPayBtn" onclick="payWithStripe(\''+kind+'\')" style="border:none;width:100%">Pay '+kindLabel+' \u2014 '+fmtMoney(amt)+'</button>'
      +'<p class="paynote">Opens a secure Stripe checkout page. We will confirm once it\u2019s received.</p>';
  }
  if(method==='Venmo'){
    var link=payLinkFor(method, amt);
    return '<a class="paybtn" target="_top" href="'+link+'">Pay '+kindLabel+' \u2014 '+fmtMoney(amt)+'</a>'
      +'<p class="paynote">Opens Venmo with the amount ready to send.</p>'+reportBtnHtml(kind,kindLabel);
  }
  if(method==='PayPal'){
    var plink=payLinkFor(method, amt);
    return '<a class="paybtn" target="_top" href="'+plink+'">Pay '+kindLabel+' — '+fmtMoney(amt)+'</a>'
      +'<p class="paynote">Opens PayPal with the amount ready to send.</p>'+reportBtnHtml(kind,kindLabel);
  }
  if(method==='Cash App'){
    return '<div class="paydetails"><div class="paydetails-title">Cash App</div>'
      +'<div>Send to: $'+CASHAPP_CASHTAG+'</div>'
      +'<div>Amount: '+fmtMoney(amt)+'</div></div>'
      +'<a class="paybtn" target="_top" href="https://cash.app/$'+CASHAPP_CASHTAG+'">Open Cash App</a>'
      +'<p class="paynote">Cash App doesn\u2019t support pre-filling the amount, so please enter '+fmtMoney(amt)+' once the app opens.</p>'+reportBtnHtml(kind,kindLabel);
  }
  var info=paymentInstructionsFor(method);
  if(info){
    return '<div class="paydetails"><div class="paydetails-title">'+info.title+'</div>'
      +'<div>Amount: '+fmtMoney(amt)+'</div>'
      +info.lines.map(function(l){ return '<div>'+l+'</div>'; }).join('')+'</div>'+reportBtnHtml(kind,kindLabel);
  }
  return '';
}
// Every pay-outside method gets an "I've sent it" button so the owner is told to
// confirm; they still verify before anything is marked received. (Card reports
// automatically on the Stripe return, so it has no button here.)
function reportBtnHtml(kind, kindLabel){
  return '<button type="button" class="paybtn" id="reportPayBtn" onclick="reportPaymentUI(\''+kind+'\')" style="border:none;width:100%;background:transparent;border:1px solid var(--gold);color:var(--gold-bright);margin-top:10px">I’ve sent my '+kindLabel.toLowerCase()+'</button>'
    +'<p class="paynote">Tap once you’ve sent it — '+esc(CFG.OWNER_NAME||'we')+' will confirm once the payment is received.</p>';
}
function reportPaymentUI(kind){
  var b=document.getElementById('reportPayBtn'); if(b){ b.disabled=true; b.textContent='Sending…'; }
  google.script.run.withSuccessHandler(function(){
    var ex=document.getElementById('paymentExtra');
    if(ex) ex.innerHTML='<div class="paydetails"><div class="paydetails-title">Thank you! ✦</div><div>We’ve let '+esc(CFG.OWNER_NAME||'the team')+' know. Your payment will be confirmed once it’s received.</div></div>';
  }).withFailureHandler(function(){ if(b){ b.disabled=false; b.textContent='Try again'; } }).reportPayment(TOKEN, kind);
}
// A direct window.top.location assignment is blocked by the browser when
// the page content is running in a cross-origin sandboxed frame (which is
// exactly how Apps Script serves this page) — browsers only allow an
// actual link click to navigate the real top-level tab in that situation,
// so this simulates one instead of touching window.top directly.
function navigateTopLevel(url){
  try{
    var a=document.createElement('a');
    a.href=url;
    a.target='_top';
    a.rel='noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }catch(e){}
}
function payWithStripe(kind){
  kind = kind || 'deposit';
  var btn=document.getElementById('cardPayBtn');
  if(!btn) return;
  btn.disabled=true;
  var originalText=btn.textContent;
  btn.textContent='Preparing checkout\u2026';
  var status=document.getElementById('payStatus');
  if(!status){
    status=document.createElement('p');
    status.id='payStatus';
    status.className='paynote';
    btn.parentNode.insertBefore(status, btn.nextSibling);
  }
  var seconds=0;
  status.textContent='Contacting Magic Manager\u2026 (0s)';
  var tickId=setInterval(function(){
    seconds++;
    status.textContent='Waiting for a response\u2026 ('+seconds+'s) \u2014 if this counter is moving, the page is still working normally.';
  }, 1000);
  var settled=false;
  var timeoutId=setTimeout(function(){
    if(settled) return;
    settled=true; clearInterval(tickId);
    btn.disabled=false; btn.textContent=originalText;
    status.textContent='Timed out after 20 seconds with no response from the server. Nothing was charged.';
    alert('This is taking longer than expected. Nothing was charged \u2014 please try again, or use another payment method if this keeps happening.');
  }, 20000);
  google.script.run.withSuccessHandler(function(json){
    if(settled) return;
    settled=true; clearTimeout(timeoutId); clearInterval(tickId);
    var r=JSON.parse(json);
    if(r.ok && r.url){
      status.textContent='Got a response \u2014 opening Stripe\u2026';
      navigateTopLevel(r.url);
      // A visible fallback in case the automatic jump is blocked for any
      // reason \u2014 this should never leave someone stuck with no way through.
      status.innerHTML='If nothing happened, <a href="'+r.url+'" target="_top" style="color:var(--gold-bright);text-decoration:underline">tap here to continue to Stripe</a>.';
    } else {
      btn.disabled=false; btn.textContent=originalText;
      status.textContent='Server said: '+(r.error||'unknown error');
      alert(r.error || 'Something went wrong \u2014 please try again.');
    }
  }).withFailureHandler(function(err){
    if(settled) return;
    settled=true; clearTimeout(timeoutId); clearInterval(tickId);
    btn.disabled=false; btn.textContent=originalText;
    status.textContent='Request failed: '+(err && err.message ? err.message : 'unknown error');
    alert('Something went wrong: ' + (err && err.message ? err.message : 'please try again.'));
  }).createStripeCheckoutSession(TOKEN, kind);
}
function renderForm(d){
  document.getElementById('loading').style.display='none';
  var c=document.getElementById('content');
  c.style.display='';
  var initialMethod = (d.paymentMethod && PAYMENT_METHODS.indexOf(d.paymentMethod)>-1) ? d.paymentMethod : 'Credit Card';
  var amt=computeAmounts(d.depositBase, d.balanceBase, initialMethod);
  var noDeposit = !(Number(d.depositBase) > 0); // deposit waived (0%) — client just pays the full balance
  var depositLabel = d.depositPaid ? 'Deposit' : 'Deposit due today';
  var amountRows = noDeposit
    ? '<div class="row"><span class="k">Total</span><span class="v">'+fmtMoney(d.balanceBase)+'</span></div>'
    : '<div class="row"><span class="k">'+depositLabel+'</span><span class="v" id="depositOut">'+fmtMoney(amt.deposit)+'</span></div>'
      +'<div class="row"><span class="k">Balance due on event date</span><span class="v" id="balanceOut">'+fmtMoney(amt.balance)+'</span></div>';
  var html=paidBannerHtml()+bookingIdHtml(d)+'<div class="card">'
    +row('Services', d.services)
    +addressRow('Location', d.location)
    +amountRows
    +'</div>'
    // Styled to match the "Your Documents" buttons below (.docbtn + fileText icon + docarrow).
    +(d.pdfUrl?'<a class="docbtn" href="'+d.pdfUrl+'" target="_blank" rel="noopener" style="margin-top:14px">'
      +'<svg class="dic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/><path d="M9 9h1"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>'
      +'<span class="doclabel">View the full agreement (PDF)</span>'
      +'<svg class="docarrow" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7l-10 10"/><path d="M8 7l9 0l0 9"/></svg></a>':'');

  if(d.depositPaid){
    // Already received before this contract link was ever opened — paid
    // another way, in advance of signing — so there's nothing to ask for
    // here. Show what's already on record instead of a payment prompt.
    html += receiptCardHtml('Deposit', d.depositReceiptUrl);
  } else if(noDeposit){
    // No deposit is collected — sign now, pay the full balance afterward from the
    // booking page. Nothing to pay at signing, so no payment prompt is shown here.
    html += '<p class="note" style="text-align:left">No deposit required — just sign below, then you can pay your balance of '+fmtMoney(d.balanceBase)+' anytime from your booking page.</p>';
  } else {
    html += '<label>How will you be paying?</label>'
      +'<select id="paymentMethod">'+PAYMENT_METHODS.map(function(m){
        return '<option value="'+m+'"'+(m===initialMethod?' selected':'')+'>'+m+'</option>';
      }).join('')+'</select>'
      +'<div id="paymentExtra">'+renderExtrasHtml(initialMethod, amt.deposit, 'deposit')+'</div>';
  }

  html += '<label>Type your full name to sign</label>'
    +'<input type="text" id="signName" placeholder="Your full name" autocomplete="name">'
    +'<div class="agree"><input type="checkbox" id="agreeBox"><span>I have read the full agreement and accept its terms.</span></div>'
    +'<button id="signBtn" disabled onclick="doSign()">Sign &amp; Accept</button>'
    +'<p class="note">Typing your name above and tapping Sign &amp; Accept serves as your electronic signature on this agreement.</p>'
    +documentButtonsHtml(d, false)
    +signatureBlockHtml();
  c.innerHTML=html;
  var nameInp=document.getElementById('signName'), agreeBox=document.getElementById('agreeBox'), btn=document.getElementById('signBtn'), pmSel=document.getElementById('paymentMethod');
  function sync(){ btn.disabled = !(nameInp.value.trim() && agreeBox.checked); }
  nameInp.oninput=sync; agreeBox.onchange=sync;
  // pmSel only exists in the DOM when a payment prompt was actually shown
  // — guarded here so an already-paid deposit (no dropdown rendered at
  // all) can't throw and break the rest of the signing form.
  if(pmSel){
    pmSel.onchange=function(){
      var a=computeAmounts(d.depositBase, d.balanceBase, pmSel.value);
      document.getElementById('depositOut').textContent=fmtMoney(a.deposit);
      document.getElementById('balanceOut').textContent=fmtMoney(a.balance);
      document.getElementById('paymentExtra').innerHTML=renderExtrasHtml(pmSel.value, a.deposit, 'deposit');
    };
  }
}
function row(k,v){
  return '<div class="row"><span class="k">'+k+'</span><span class="v">'+(v||'\u2014')+'</span></div>';
}
// Keeps the tail of an address (the word right before the last comma,
// plus everything after it — typically "City, ST 12345") from ever being
// torn apart across a line break. Doesn't force a break where there's
// room for the whole address on one line — it only changes how the
// wrap falls when one's actually needed.
function addressRow(k,v){
  var addr=String(v||'');
  if(!addr) return row(k,v);
  var lastComma=addr.lastIndexOf(',');
  if(lastComma===-1) return row(k,v);
  var wordStart=addr.lastIndexOf(' ', lastComma-1)+1;
  var head=addr.slice(0,wordStart);
  var tail=addr.slice(wordStart);
  return '<div class="row"><span class="k">'+k+'</span><span class="v">'+head+'<span style="white-space:nowrap">'+tail+'</span></span></div>';
}
function doSign(){
  var name=document.getElementById('signName').value.trim();
  var pmEl=document.getElementById('paymentMethod');
  var method=pmEl ? pmEl.value : '';
  if(!name) return;
  var btn=document.getElementById('signBtn');
  btn.disabled=true;
  var originalText=btn.textContent;
  btn.textContent='Signing\u2026';
  var status=document.getElementById('signStatus');
  if(!status){
    status=document.createElement('p');
    status.id='signStatus';
    status.className='note';
    btn.parentNode.insertBefore(status, btn.nextSibling);
  }
  var seconds=0;
  status.textContent='Preparing your signed agreement\u2026 this takes a few seconds, since a real signed PDF is being built just for you.';
  var tickId=setInterval(function(){
    seconds++;
    status.textContent='Still working\u2026 ('+seconds+'s) \u2014 building your signed PDF.';
  }, 1000);
  function stopTicking(){ clearInterval(tickId); }
  google.script.run.withSuccessHandler(function(json){
    var r=JSON.parse(json);
    if(r.ok){
      status.textContent='Signed \u2014 loading your booking page\u2026';
      // Move straight into the same status page a returning visitor sees —
      // right after signing that means prompting for the deposit next,
      // rather than leaving them at a dead-end "thanks" message.
      google.script.run.withSuccessHandler(function(json2){
        stopTicking();
        var d2=JSON.parse(json2);
        applyBank(d2);
        if(d2.ok) renderStatusPage(d2); else renderSuccess(name);
      }).withFailureHandler(function(){ stopTicking(); renderSuccess(name); }).getContractForSigning(TOKEN);
    } else {
      stopTicking();
      btn.disabled=false; btn.textContent=originalText; status.textContent='';
      alert('Something went wrong \u2014 please try again.');
    }
  }).withFailureHandler(function(){
    stopTicking();
    btn.disabled=false; btn.textContent=originalText; status.textContent='';
    alert('Something went wrong \u2014 please try again.');
  }).submitContractSignature(TOKEN, name, method);
}
function renderSuccess(name){
  var c=document.getElementById('content');
  c.innerHTML='<div class="signed"><div class="big">&#10038;</div><div>Thank you, <b>'+esc(name)+'</b> \u2014 your signature has been recorded. We will be in touch.</div></div>';
}

if(!TOKEN){
  renderError();
} else {
  google.script.run.withSuccessHandler(function(json){
    var d=JSON.parse(json);
    applyBank(d);
    if(!d.ok) renderError();
    else if(d.alreadySigned) renderStatusPage(d);
    else renderForm(d);
  }).withFailureHandler(renderError).getContractForSigning(TOKEN);
}
</script>
</body>
